format: nlp2dsl.conversation.scenario.v1
example_id: 05-conversation-flow
title: Dialog faktury — wariant LLM
nlp_mode: llm
record_llm_routing: true

turns:
  - role: user
    text: Chcę wysłać fakturę za usługi dla klient@firma.pl
    expect:
      status_in: [in_progress, ready]
  - role: user
    text: Kwota to 1500 PLN
    expect:
      status_in: [in_progress, ready]
      dsl_action_any: [send_invoice]
  - role: user
    text: uruchom
    expect:
      status: executed
      execution_completed: true
    optional_if_executed: true

validations:
  - id: execution.completed
    type: execution_completed
