format: nlp2dsl.execution.scenario.v1
example_id: 01-invoice
title: Faktura → execute

queries:
  - query: Wyślij fakturę na 1500 PLN do klient@firma.pl
    mode: auto
    execute: true
    expect:
      status: executed
      dsl_action: send_invoice
      execution_completed: true

validations:
  - id: dsl.send_invoice
    type: dsl_action
    action: send_invoice
  - id: execution.completed
    type: execution_completed
