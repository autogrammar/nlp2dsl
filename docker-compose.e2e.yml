# E2E overlay: mock serwisy + montowanie fixture per przykład.
# Użycie:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     --profile invoice --profile email --profile conversation --profile llm up -d --build

services:
  nlp-service:
    # The service writes generated traces into the bind-mounted examples tree.
    # Match the invoking host user so the host-side TestQL reporter can update
    # those artifacts after the container scenarios finish.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

  smtp-mock:
    image: mailhog/mailhog:latest
    ports:
      - "${SMTP_MOCK_PORT:-8025}:8025"
      - "${SMTP_MOCK_SMTP_PORT:-1025}:1025"
    profiles: [email, invoice]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_e2e_data:/data
    profiles: [storage, reports]

  example-fixtures:
    image: alpine:3.20
    profiles: [conversation, invoice, email, reports, scheduled]
    volumes:
      - ./examples/01-invoice/fixtures:/fixtures/01-invoice:ro
    command: ["sh", "-c", "echo example fixtures mounted && sleep infinity"]

volumes:
  minio_e2e_data:
